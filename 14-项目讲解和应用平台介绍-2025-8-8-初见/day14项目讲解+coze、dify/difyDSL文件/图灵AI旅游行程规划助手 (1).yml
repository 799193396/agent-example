      default: ''
      label: 旅游目的地
      max_length: 48
      required: true
      variable: travel_destination
  - text-input:
      default: ''
      label: 旅行时长
      max_length: 48
      required: true
      variable: travel_duration
  - text-input:
      default: ''
      label: 兴趣
      max_length: 48
      required: false
      variable: travel_interests
  - text-input:
      default: ''
      label: 旅游出发地
      max_length: 48
      required: true
      variable: place_destination
  - number:
      default: ''
      label: 预算金额
      required: true
      variable: budget
version: 0.3.0
